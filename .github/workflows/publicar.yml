name: Publicar no npm

# Publica o pacote mcp-imposto-de-renda quando uma tag de versão (v0.1.0, v0.2.0...) é enviada.
# Requer o segredo NPM_TOKEN (token de automação do npm) em Settings > Secrets and variables > Actions.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: publicar-npm
  cancel-in-progress: false

jobs:
  publicar:
    name: publicar
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Conferir que a tag bate com a versão do pacote
        run: |
          versao="$(node -p "require('./apps/cli/package.json').version")"
          if [ "v${versao}" != "${GITHUB_REF_NAME}" ]; then
            echo "A tag ${GITHUB_REF_NAME} não bate com a versão ${versao} de apps/cli/package.json." >&2
            exit 1
          fi
      - name: Publicar
        working-directory: apps/cli
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
