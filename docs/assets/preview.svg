<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="t d">
  <title id="t">MCP Imposto de Renda</title>
  <desc id="d">Projeto independente, não oficial. Servidor MCP local para a declaração do IRPF, com o exemplo fictício do assalariado simples: 100% local, código aberto e cálculo ao centavo. Comando npx mcp-imposto-de-renda.</desc>
  <defs>
