<svg xmlns="http://www.w3.org/2000/svg" fill="#071D41" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="t d">
  <title id="t">Formato do arquivo .DBK</title>
  <desc id="d">O arquivo .DBK é uma sequência de linhas de posição fixa. Cada linha começa com o tipo do registro, traz os campos nas colunas definidas pelo leiaute do ano e termina com o CRC32 da própria linha. O registro T9 fecha o arquivo com a contagem de registros por tipo e um CRC.</desc>
  <style>
    text{font-family:Rawline,Raleway,"Avenir Next","Segoe UI",Helvetica,Arial,sans-serif}
    .h{font-size:26px;font-weight:700}
    .sub{font-size:16px;fill:#555555}
    .b{font-size:16px;font-weight:700}
    .s{font-size:14px;fill:#333333}
    .lbl{font-size:14px;fill:#C5D4EB}
    .ru{font-size:13px;fill:#CCCCCC;font-weight:600}
    .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:14px}
    .tp{fill:#1351B4;stroke:#5992ED}
    .fd{fill:#0C326F;stroke:#345D96}
    .cr{fill:#154C21;stroke:#00A91C}
  </style>
  <rect x="1" y="1" width="1198" height="618" rx="18" fill="#FFFFFF" stroke="#E6E6E6" stroke-width="2"/>
  <text x="40" y="52" class="h">Formato .DBK: registros de posição fixa</text>
  <text x="40" y="78" class="sub">Exemplo ilustrativo com dados fictícios. As colunas exatas de cada campo vêm do leiaute do ano.</text>

  <rect x="40" y="100" width="1120" height="330" rx="14" fill="#071D41"/>

  
  <text x="270" y="132" class="ru" text-anchor="middle">tipo</text>
  <text x="630" y="132" class="ru" text-anchor="middle">campos em colunas fixas</text>
  <text x="1050" y="132" class="ru" text-anchor="middle">CRC32 da linha</text>
  <path d="M240 142H300M310 142H950M960 142H1140" stroke="#345D96" stroke-width="2"/>

  
  <g>
    <text x="220" y="177" class="lbl" text-anchor="end">cabeçalho</text>
    <rect x="240" y="155" width="60" height="32" rx="6" class="tp"/>
    <text x="270" y="176" class="m" fill="#D4E5FF" text-anchor="middle">IR</text>
    <rect x="310" y="155" width="640" height="32" rx="6" class="fd"/>
    <text x="324" y="176" class="m" fill="#E6E6E6" xml:space="preserve">2026 2025 00000000000 FULANO DE TAL         ...</text>
    <rect x="960" y="155" width="180" height="32" rx="6" class="cr"/>
    <text x="1050" y="176" class="m" fill="#B7F5BD" text-anchor="middle">3141592653</text>
  </g>
  <g>
    <text x="220" y="221" class="lbl" text-anchor="end">identificação</text>
    <rect x="240" y="199" width="60" height="32" rx="6" class="tp"/>
    <text x="270" y="220" class="m" fill="#D4E5FF" text-anchor="middle">16</text>
    <rect x="310" y="199" width="640" height="32" rx="6" class="fd"/>
    <text x="324" y="220" class="m" fill="#E6E6E6" xml:space="preserve">00000000000 RUA EXEMPLO 100      CIDADE      ...</text>
    <rect x="960" y="199" width="180" height="32" rx="6" class="cr"/>
    <text x="1050" y="220" class="m" fill="#B7F5BD" text-anchor="middle">2718281828</text>
  </g>
  <g>
    <text x="220" y="265" class="lbl" text-anchor="end">rendimentos</text>
    <rect x="240" y="243" width="60" height="32" rx="6" class="tp"/>
    <text x="270" y="264" class="m" fill="#D4E5FF" text-anchor="middle">21</text>
    <rect x="310" y="243" width="640" height="32" rx="6" class="fd"/>
    <text x="324" y="264" class="m" fill="#E6E6E6" xml:space="preserve">00000000000000 EMPRESA FICTICIA     0000005432100 ...</text>
    <rect x="960" y="243" width="180" height="32" rx="6" class="cr"/>
    <text x="1050" y="264" class="m" fill="#B7F5BD" text-anchor="middle">1414213562</text>
  </g>
  <g>
    <text x="220" y="309" class="lbl" text-anchor="end">bens e direitos</text>
    <rect x="240" y="287" width="60" height="32" rx="6" class="tp"/>
    <text x="270" y="308" class="m" fill="#D4E5FF" text-anchor="middle">27</text>
    <rect x="310" y="287" width="640" height="32" rx="6" class="fd"/>
    <text x="324" y="308" class="m" fill="#E6E6E6" xml:space="preserve">01 APARTAMENTO EXEMPLO          0000025000000 ...</text>
    <rect x="960" y="287" width="180" height="32" rx="6" class="cr"/>
    <text x="1050" y="308" class="m" fill="#B7F5BD" text-anchor="middle">1732050807</text>
  </g>
  <text x="270" y="342" class="m" fill="#98AFD2" text-anchor="middle">⋮</text>
  <text x="630" y="342" class="m" fill="#98AFD2" text-anchor="middle">demais registros</text>
  <g>
    <text x="220" y="387" class="lbl" text-anchor="end" style="fill:#FEE685;font-weight:700">trailer</text>
    <rect x="240" y="365" width="60" height="32" rx="6" fill="#5C4809" stroke="#FFCD07"/>
    <text x="270" y="386" class="m" fill="#FEE685" text-anchor="middle">T9</text>
    <rect x="310" y="365" width="640" height="32" rx="6" class="fd" style="stroke:#FFCD07"/>
    <text x="324" y="386" class="m" fill="#FEE685" xml:space="preserve">IR=1  16=1  21=3  27=2  ...  total de linhas</text>
    <rect x="960" y="365" width="180" height="32" rx="6" class="cr"/>
    <text x="1050" y="386" class="m" fill="#B7F5BD" text-anchor="middle">CRC final</text>
  </g>

  
  <g>
    <rect x="40" y="456" width="358" height="134" rx="12" fill="#EDF5FF" stroke="#81AEFC"/>
    <text x="60" y="488" class="b">Posição fixa</text>
    <text x="60" y="514" class="s">Cada campo ocupa colunas definidas</text>
    <text x="60" y="534" class="s">pelo leiaute do ano. Valores são</text>
    <text x="60" y="554" class="s">completados com zeros ou espaços.</text>

    <rect x="421" y="456" width="358" height="134" rx="12" fill="#E3F5E1" stroke="#70E17B"/>
    <text x="441" y="488" class="b">CRC32 por linha</text>
    <text x="441" y="514" class="s">Calculado sobre o conteúdo da linha.</text>
    <text x="441" y="534" class="s">Um byte alterado invalida o registro,</text>
    <text x="441" y="554" class="s">e o codec recusa o arquivo.</text>

    <rect x="802" y="456" width="358" height="134" rx="12" fill="#FFF5C2" stroke="#FFCD07"/>
    <text x="822" y="488" class="b">Registro T9</text>
    <text x="822" y="514" class="s">Fecha o arquivo com a contagem de</text>
    <text x="822" y="534" class="s">registros por tipo e um CRC. O codec</text>
    <text x="822" y="554" class="s">confere na leitura e refaz na escrita.</text>
  </g>
</svg>
