name: CI

on:
  push:
    branches: [main]
  pull_request:

# Permissão mínima: os jobs só leem o repositório.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Actions fixadas por SHA de commit (a tag fica no comentário). O Dependabot atualiza ambos.
jobs:
  check:
    name: lint, typecheck, test e build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  docs:
    name: documentação
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Catálogo e exemplos pelo servidor real, tabelas de docs/ferramentas e contagens do README.
      - run: pnpm test:docs
      - run: pnpm docs:links

  coverage:
    name: cobertura
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Limites alguns pontos abaixo do medido em 14/10/2026 (ver docs/testes.md). O core tem
      # limite próprio, mais alto; o global acompanha o servidor MCP e o CLI, ainda em obras.
      # Medido: core 94,9% linhas, 94,4% instruções, 96,1% funções, 81,9% ramos; total 84,2%,
      # 82,6%, 81,2% e 70,2%.
      - run: >-
          pnpm vitest run
          --coverage.enabled
          --coverage.provider=v8
          --coverage.include='packages/*/src/**'
          --coverage.include='apps/*/src/**'
          --coverage.reporter=text-summary
          --coverage.thresholds.lines=80
          --coverage.thresholds.statements=78
          --coverage.thresholds.functions=77
          --coverage.thresholds.branches=66
          '--coverage.thresholds.packages/core/src/**.lines=92'
          '--coverage.thresholds.packages/core/src/**.statements=92'
          '--coverage.thresholds.packages/core/src/**.functions=93'
          '--coverage.thresholds.packages/core/src/**.branches=78'

  audit:
    name: auditoria de dependências
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # Produção: qualquer vulnerabilidade conhecida falha. Desenvolvimento: a partir de moderada.
      - run: pnpm audit --prod
      - run: pnpm audit --audit-level moderate
