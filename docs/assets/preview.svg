      <stop offset="0" stop-color="#AFE0FA"/>
      <stop offset="1" stop-color="#E0F2FD"/>
    </linearGradient>
  </defs>
  <style>
    .f{font-family:Rawline,Raleway,"Avenir Next","Segoe UI",Helvetica,Arial,sans-serif}
    .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  </style>

  <rect width="1280" height="640" fill="#FFFFFF"/>

