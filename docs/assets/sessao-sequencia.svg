<svg xmlns="http://www.w3.org/2000/svg" fill="#071D41" width="1200" height="860" viewBox="0 0 1200 860" role="img" aria-labelledby="t d">
  <title id="t">Sequência de uma sessão típica</title>
  <desc id="d">O cliente MCP inicia o servidor por stdio e lista as ferramentas. Ao chamar adicionar_pagamento, o servidor valida os argumentos, lê o arquivo .DBK pela pasta autorizada, converte os registros no modelo com o core, aplica a alteração, valida, gera os registros com controles recalculados e grava de forma atômica com cópia de segurança. A resposta volta com texto e dados estruturados, incluindo as pendências.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#555555"/>
    </marker>
    <marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#1351B4"/>
    </marker>
  </defs>
  <style>
    text{font-family:Rawline,Raleway,"Avenir Next","Segoe UI",Helvetica,Arial,sans-serif}
    text{paint-order:stroke;stroke:#FFFFFF;stroke-width:5px;stroke-linejoin:round}
    .h{font-size:26px;font-weight:700}
    .sub{font-size:16px;fill:#555555}
    .b{font-size:17px;font-weight:700}
    .xs{font-size:13px;fill:#555555}
    .s{font-size:14px;fill:#333333}
    .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;fill:#1351B4}
    .n{font-size:12px;font-weight:700;fill:#FFFFFF;stroke:none}
    .vida{stroke:#CCCCCC;stroke-width:2;stroke-dasharray:6 6}
    .ida{stroke:#555555;stroke-width:2;fill:none}
    .volta{stroke:#1351B4;stroke-width:2;fill:none;stroke-dasharray:7 5}
    .box{fill:#FFFFFF;stroke:#CCCCCC;stroke-width:1.5}
    .acc{fill:#EDF5FF;stroke:#1351B4;stroke-width:2}
    .act{fill:#D4E5FF;stroke:#1351B4;stroke-width:1.5}
  </style>
  <rect x="1" y="1" width="1198" height="858" rx="18" fill="#FFFFFF" stroke="#E6E6E6" stroke-width="2"/>
  <text x="40" y="52" class="h">Uma sessão típica, passo a passo</text>
  <text x="40" y="78" class="sub">Do pedido de inclusão de uma despesa até a gravação do .DBK. Nada sai da sua máquina, exceto o que o cliente envia ao LLM.</text>

  
  <rect x="60" y="104" width="200" height="64" rx="12" class="box"/>
  <text x="160" y="132" class="b" text-anchor="middle">Cliente MCP</text>
  <text x="160" y="153" class="xs" text-anchor="middle">assistente ou editor</text>
  <rect x="360" y="104" width="220" height="64" rx="12" class="acc"/>
  <text x="470" y="132" class="b" text-anchor="middle">Servidor MCP</text>
  <text x="470" y="153" class="m" text-anchor="middle">packages/mcp</text>
  <rect x="680" y="104" width="200" height="64" rx="12" class="box"/>
  <text x="780" y="132" class="b" text-anchor="middle">Core</text>
  <text x="780" y="153" class="m" text-anchor="middle">packages/core, sem I/O</text>
  <rect x="960" y="104" width="200" height="64" rx="12" class="box"/>
  <text x="1060" y="132" class="b" text-anchor="middle">Disco</text>
  <text x="1060" y="153" class="xs" text-anchor="middle">só a pasta de --dir</text>

  <path d="M160 168V800" class="vida"/>
  <path d="M470 168V800" class="vida"/>
  <path d="M780 168V800" class="vida"/>
  <path d="M1060 168V800" class="vida"/>

  
  <rect x="462" y="190" width="16" height="600" rx="4" class="act"/>

  
  <circle cx="80" cy="200" r="11" fill="#555555"/><text x="80" y="204" class="n" text-anchor="middle">1</text>
  <path d="M168 205H456" class="ida" marker-end="url(#a)"/>
  <text x="312" y="196" class="s" text-anchor="middle">initialize, tools/list (stdio)</text>
  <path d="M456 240H168" class="volta" marker-end="url(#p)"/>
  <text x="312" y="232" class="s" text-anchor="middle">154 ferramentas, com anotações</text>

  
  <circle cx="80" cy="285" r="11" fill="#555555"/><text x="80" y="289" class="n" text-anchor="middle">2</text>
  <path d="M168 290H456" class="ida" marker-end="url(#a)"/>
  <text x="312" y="272" class="s" text-anchor="middle">tools/call adicionar_pagamento</text>
  <text x="312" y="309" class="m" text-anchor="middle">{ arquivo, item }</text>
  <text x="492" y="330" class="xs">argumentos conferidos pelo esquema zod;</text>
  <text x="492" y="347" class="xs">valor em texto vira centavos</text>

  
  <circle cx="80" cy="380" r="11" fill="#555555"/><text x="80" y="384" class="n" text-anchor="middle">3</text>
  <path d="M478 385H1052" class="ida" marker-end="url(#a)"/>
  <text x="765" y="376" class="s" text-anchor="middle">PastaAutorizada.ler(nome relativo, .DBK)</text>
  <path d="M1052 415H478" class="volta" marker-end="url(#p)"/>
  <text x="765" y="407" class="s" text-anchor="middle">bytes do arquivo (latin-1, até 20 MB)</text>

  
  <circle cx="80" cy="460" r="11" fill="#555555"/><text x="80" y="464" class="n" text-anchor="middle">4</text>
  <path d="M478 465H772" class="ida" marker-end="url(#a)"/>
  <text x="625" y="456" class="m" text-anchor="middle">lerArquivo, registrosParaModelo</text>
  <path d="M772 495H478" class="volta" marker-end="url(#p)"/>
  <text x="625" y="487" class="s" text-anchor="middle">Declaracao (modelo tipado)</text>
  <text x="492" y="520" class="xs">aplica a inclusão no modelo</text>

  
  <circle cx="80" cy="555" r="11" fill="#555555"/><text x="80" y="559" class="n" text-anchor="middle">5</text>
  <path d="M478 560H772" class="ida" marker-end="url(#a)"/>
  <text x="625" y="542" class="m" text-anchor="middle">validarDeclaracao</text>
  <text x="625" y="580" class="m" text-anchor="middle">modeloParaRegistros(base)</text>
  <path d="M772 610H478" class="volta" marker-end="url(#p)"/>
  <text x="625" y="602" class="s" text-anchor="middle">pendências e registros</text>
  <text x="792" y="560" class="xs">recalcula o Resumo com o motor,</text>
  <text x="792" y="577" class="xs">CRC-32, contagens do T9 e hash</text>

  
  <circle cx="80" cy="655" r="11" fill="#555555"/><text x="80" y="659" class="n" text-anchor="middle">6</text>
  <path d="M478 660H1052" class="ida" marker-end="url(#a)"/>
  <text x="765" y="651" class="s" text-anchor="middle">escrever: temporário, fsync, rename</text>
  <path d="M1052 690H478" class="volta" marker-end="url(#p)"/>
  <text x="765" y="682" class="s" text-anchor="middle">gravado; anterior em .mcp-imposto-de-renda-backups</text>

  
  <circle cx="80" cy="745" r="11" fill="#555555"/><text x="80" y="749" class="n" text-anchor="middle">7</text>
  <path d="M456 750H168" class="volta" marker-end="url(#p)"/>
  <text x="312" y="741" class="s" text-anchor="middle">texto em pt-BR + structuredContent</text>
  <text x="312" y="770" class="m" text-anchor="middle">{ backup, podeEntregar, pendencias }</text>

  
  <path d="M60 826H110" class="ida" marker-end="url(#a)"/>
  <text x="120" y="830" class="xs">chamada</text>
  <path d="M200 826H250" class="volta" marker-end="url(#p)"/>
  <text x="260" y="830" class="xs">resposta</text>
  <text x="360" y="830" class="xs">Ferramentas de leitura param na etapa 4. Com --somente-leitura, as que gravam nem são registradas.</text>
</svg>
